dataset:
  name: CAND-VB2-2026 Verified Knowledge Base
  scope: Tuyển mới đào tạo đại học chính quy CAND đối với công dân đã có bằng tốt nghiệp đại học trở lên
  verified_at: '2026-09-08'
  policy: Chỉ dùng nguồn cấp A từ Bộ Công an, CSDL văn bản Bộ Công an hoặc website chính thức học viện/trường CAND. Tin báo chí, forum, TikTok, Facebook cá nhân và trung tâm luyện thi không được dùng làm bằng chứng chuẩn.
  temporal_rule: Thông tin năm 2026 được ưu tiên; văn bản pháp luật phải còn hiệu lực tại ngày xác minh. Nguồn cũ chỉ được dùng khi được văn bản 2026 dẫn chiếu rõ ràng và không có quy định mới thay thế.

