dataset:
  name: CAND-VB2-2026 Verified Knowledge Base
  scope: Tuyển mới đào tạo đại học chính quy CAND đối với công dân đã có bằng tốt nghiệp đại học trở lên
  verified_at: '2026-09-08'
  policy: Chỉ dùng nguồn chính thức cấp A0/A1 làm bằng chứng trả lời. Dự thảo được theo dõi riêng và tuyệt đối không được coi là quy định có hiệu lực.
  authority_order:
    - A0_legal_or_central: CSDL văn bản Bộ Công an, Cổng Bộ Công an, Cổng văn bản Chính phủ/Bộ GDĐT
    - A1_official_school: website chính thức học viện/trường CAND
  temporal_classes:
    IN_FORCE: Quy phạm pháp luật đang có hiệu lực hoặc được nguồn trung tâm 2026 viện dẫn như căn cứ hiện hành
    ANNUAL_2026: Chỉ tiêu, lịch, phương thức, hồ sơ và vận hành riêng kỳ tuyển sinh 2026
    CURRENT_STATUS: Trạng thái triển khai được xác minh tại một ngày cụ thể
    WATCH_ONLY_DRAFT: Dự thảo/chưa có hiệu lực; không được dùng làm căn cứ tư vấn
  temporal_rule: Không suy rộng lịch/chỉ tiêu năm 2026 sang 2027. Văn bản pháp luật được gắn ngày xác minh và rủi ro thay đổi. Khi xuất hiện dự thảo thay thế/sửa đổi, phải hạ mức ổn định tương lai dù văn bản hiện tại vẫn còn hiệu lực.

