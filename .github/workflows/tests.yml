name: quality-gate

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "LICENSE"

# If several related commits are pushed quickly, only the newest run matters.
# Dataset/registry/benchmark changes should still be committed atomically.
concurrency:
  group: cand-vb2-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate official-source governance
        run: python scripts/validate_sources.py
      - name: Validate topic coverage
        run: python scripts/validate_coverage.py
      - name: Validate Colab/runtime contract and secret hygiene
        run: python scripts/validate_runtime_contract.py
      - name: Compile Python sources
        run: python -m compileall -q src scripts app.py
      - name: Unit tests
        run: pytest -q
